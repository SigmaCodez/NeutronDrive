pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  proxy_cache_path /tmp/releases-cache levels=1:2 keys_zone=releases:1m max_size=8m inactive=10m use_temp_path=off;
  access_log off;
  sendfile on;
  keepalive_timeout 20;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 20s;
  client_max_body_size 1k;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  server {
    listen 31219;
    root /usr/share/nginx/html;
    include /etc/nginx/security-headers.conf;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    # Fixed public GitHub endpoint. No visitor credentials or headers forwarded.
    location = /api/releases {
      proxy_pass https://api.github.com/repos/SigmaCodez/NeutronDrive/releases?per_page=100;
      proxy_pass_request_headers off;
      proxy_set_header Host api.github.com;
      proxy_set_header User-Agent NeutronDrive-Website;
      proxy_set_header Accept application/vnd.github+json;
      proxy_ssl_server_name on;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
      proxy_cache releases;
      proxy_cache_key neutrondrive-public-releases;
      proxy_cache_valid 200 5m;
      proxy_cache_lock on;
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_hide_header Set-Cookie;
      proxy_hide_header Cache-Control;
      proxy_hide_header Expires;
    }
    # The server updater publishes one atomic snapshot; the web container only reads it.
    location = /live/current/content.json { expires -1; try_files $uri =404; }
    location = /live/status.json { expires -1; try_files $uri =404; }
    location ~ "^/live/snapshots/[a-f0-9]{64}/screenshots/[a-z-]+\.png$" { expires 1d; try_files $uri =404; }
    location /live/ { return 404; }
    location = /health { return 200 'ok\n'; }
    location ~ /\. { deny all; }
    location /_next/static/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
  }
}
