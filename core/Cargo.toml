[package]
name = "neutrondrive-core"
version = "0.6.0-alpha.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
