[package]
name = "neutrondrive-core"
version = "0.6.0-alpha.11"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-core = "=0.3.34"
zruntime = { version = "=0.2.1", default-features = false, features = ["runtime", "helper"] }
zbus = { version = "=6.1.0", default-features = false, features = ["default-rt", "proxy", "service"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "platform-verifier"] }
fuser = { version = "=0.18.0", default-features = false }
sha1 = "=0.10.6"
sha2 = "=0.10.9"
libc = "=0.2.189"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
