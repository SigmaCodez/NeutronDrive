name: Tests and Linux packages

on:
  push:
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - name: Test and lint the offline Rust core
        working-directory: core
        run: |
          cargo test --locked --offline
          cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Build the baseline-compatible shared library
        run: python3 scripts/build-rust-core
      - uses: actions/upload-artifact@v4
        with:
          name: rust-core-x86_64
          path: build/rust/*
          if-no-files-found: error

  linux-filesystem:
    env:
      NEUTRONDRIVE_CORE_BUILD: ${{ github.workspace }}/build/rust
    needs: rust-core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-core-x86_64
          path: build/rust
      - name: Install native filesystem and D-Bus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyfuse3 python3-trio fuse3 python3-gi dbus-daemon
      - name: Exercise the real Linux FUSE mount
        env:
          PYTHONPATH: src
          NEUTRONDRIVE_FUSE_TEST: '1'
        run: |
          /usr/bin/python3 -m unittest discover -s tests -p test_fuse_mount.py -v
          NEUTRONDRIVE_DBUS_TEST=1 /usr/bin/python3 -m unittest discover -s tests -p test_desktop_integration.py -v

  bridge-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Validate SDK event bridge protocol
        run: bun test packaging/bridge/eventProtocol.test.ts

  qt-lts:
    env:
      NEUTRONDRIVE_CORE_BUILD: ${{ github.workspace }}/build/rust
    needs: rust-core
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-core-x86_64
          path: build/rust
      - name: Install the oldest supported x86_64 desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon python3-gi xvfb libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-randr0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-render0 libxcb-shape0 libxcb-glx0 libfontconfig1 libdbus-1-3 libsm6 libice6 libatomic1 libwayland-client0 libwayland-cursor0 libwayland-egl1
      - name: Fetch pinned Qt runtime
        run: python3 packaging/qt_runtime.py --dest build/qt
      - name: Check Qt X11 shared-library dependencies
        run: python3 -c "import subprocess; output=subprocess.check_output(['ldd','build/qt/PySide6/Qt/plugins/platforms/libqxcb.so'],text=True); print(output); assert 'not found' not in output"
      - name: Exercise Qt 6 on Ubuntu 22.04
        run: xvfb-run -a env QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=xcb PYTHONPATH=src:build/qt NEUTRONDRIVE_UI_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_ui.py -v
      - name: Exercise live appearance portal messages on a private bus
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb PYTHONPATH=src:build/qt NEUTRONDRIVE_UI_TESTS=1 NEUTRONDRIVE_DBUS_TEST=1 /usr/bin/python3 -m unittest discover -s tests -p test_appearance.py -v

  tests:
    env:
      NEUTRONDRIVE_CORE_BUILD: ${{ github.workspace }}/build/rust
    needs: rust-core
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-core-x86_64
          path: build/rust
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test backend and synchronization logic
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile application and packaging modules
        run: python -m compileall -q src packaging scripts

  deb:
    needs: tests
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install validation tools and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi libsecret-1-0 xdg-utils desktop-file-utils appstream xvfb python3-pyfuse3 python3-trio fuse3
      - name: Validate desktop integration
        run: |
          desktop-file-validate data/io.github.SigmaCodez.NeutronDrive.desktop
          appstreamcli validate --no-net data/io.github.SigmaCodez.NeutronDrive.metainfo.xml
      - name: Build bundled DEB
        run: python3 scripts/build-deb --arch '${{ matrix.architecture }}'
      - name: Inspect package and smoke-test bundled CLI
        run: |
          dpkg-deb --info dist/*.deb
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a env QT_QPA_PLATFORM=xcb PYTHONPATH=/usr/lib/neutrondrive:/usr/lib/neutrondrive/qt NEUTRONDRIVE_UI_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_ui.py -v
          /usr/lib/neutrondrive/bin/proton-drive version --json
          neutrondrive --help
          neutrondrive --diagnose
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software PYTHONPATH=/usr/lib/neutrondrive:/usr/lib/neutrondrive/qt NEUTRONDRIVE_UI_TESTS=1 python3 -m unittest discover -s tests -p test_ui.py -v
          PYTHONPATH=/usr/lib/neutrondrive python3 -m unittest discover -s tests -p test_rust_core.py -v
          /usr/bin/python3 -c 'import pyfuse3, trio, gi'
          PYTHONPATH=/usr/lib/neutrondrive /usr/bin/python3 -m unittest discover -s tests -p test_local_trash.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.architecture }}
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    needs: tests
    env:
      NEUTRONDRIVE_CORE_BUILD: ${{ github.workspace }}/build/rust
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: fedora
            container: fedora:44
            install: dnf install -y git python3 rpm-build gcc pkgconf-pkg-config fuse3-devel python3-devel python3-pip python3-setuptools python3-setuptools_scm python3-cython python3-wheel python3-trio
            install_package: dnf install -y ./dist/*.rpm
          - distribution: opensuse
            container: opensuse/tumbleweed:latest
            install: zypper --non-interactive install git python3 rpm-build
            install_package: zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm ./dist/*.rpm
    container: ${{ matrix.container }}
    steps:
      - name: Install build tools
        run: ${{ matrix.install }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-core-x86_64
          path: build/rust
      - name: Build bundled RPM
        run: python3 scripts/build-rpm
      - name: Inspect package
        run: rpm -qpi dist/*.rpm
      - name: Install package and verify runtime dependencies
        run: |
          ${{ matrix.install_package }}
          PYTHONPATH=/usr/lib/neutrondrive python3 -c 'import pyfuse3, trio, gi; print(pyfuse3.__file__)'
          PYTHONPATH=/usr/lib/neutrondrive python3 -m unittest discover -s tests -p test_ondemand.py -v
          PYTHONPATH=/usr/lib/neutrondrive python3 -m unittest discover -s tests -p test_local_trash.py -v
          neutrondrive --diagnose
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software PYTHONPATH=/usr/lib/neutrondrive:/usr/lib/neutrondrive/qt NEUTRONDRIVE_UI_TESTS=1 python3 -m unittest discover -s tests -p test_ui.py -v
          PYTHONPATH=/usr/lib/neutrondrive python3 -m unittest discover -s tests -p test_rust_core.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distribution }}-x86_64
          path: dist/*.rpm
          if-no-files-found: error

  flatpak:
    needs: tests
    env:
      NEUTRONDRIVE_CORE_BUILD: ${{ github.workspace }}/build/rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-core-x86_64
          path: build/rust
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build bundled Flatpak
        run: python3 scripts/build-flatpak --install-deps
      - name: Verify CLI was preserved by the builder
        run: python3 packaging/fetch-backend.py build/flatpak-x86_64/files/lib/neutrondrive/bin/proton-drive --arch x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-x86_64
          path: dist/*.flatpak
          if-no-files-found: error

  snap:
    needs: tests
    env:
      NEUTRONDRIVE_CORE_BUILD: ${{ github.workspace }}/build/rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-core-x86_64
          path: build/rust
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic
      - name: Prepare isolated source and verified backend
        run: python3 scripts/build-snap --prepare-only build/snap-project
      - name: Build strict snap on the disposable runner
        working-directory: build/snap-project
        run: sudo snapcraft --destructive-mode --build-for=amd64
      - uses: actions/upload-artifact@v4
        with:
          name: snap-amd64
          path: build/snap-project/*.snap
          if-no-files-found: error
