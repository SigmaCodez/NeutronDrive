name: Tests and Linux packages

on:
  push:
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      verified_native_run:
        description: 'Optional completed run whose native tests/artifacts match this source (unchanged native source; packaging/docs-only changes)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate platform-independent desktop metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate data/io.github.SigmaCodez.NeutronDrive.desktop
          appstreamcli validate --no-net data/io.github.SigmaCodez.NeutronDrive.metainfo.xml

  native:
    if: inputs.verified_native_run == ''
    uses: ./.github/workflows/native-build.yml

  verified_native:
    if: inputs.verified_native_run != ''
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        architecture: [x86_64, aarch64]
    env:
      GH_TOKEN: ${{ github.token }}
      ND_NATIVE_RUN: ${{ inputs.verified_native_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful native tests and unchanged application/build inputs
        run: |
          python3 -c 'import os; assert os.environ["ND_NATIVE_RUN"].isdigit(), "Expected a numeric run ID"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ND_NATIVE_RUN" > "$RUNNER_TEMP/native-run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$ND_NATIVE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/native-jobs.json"
          nd_source_sha=$(python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root/'native-run.json').read_text())
          assert run['status'] == 'completed', 'Source run must be completed'
          sha = run['head_sha']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          jobs = [j for page in json.loads((root/'native-jobs.json').read_text()) for j in page['jobs']]
          for architecture in ('x86_64', 'aarch64'):
              matches = [j for j in jobs if j['name'].startswith('native / native (') and architecture in j['name']]
              assert len(matches) == 1 and matches[0]['conclusion'] == 'success', architecture+' native test job did not pass'
          print(sha)
          PY
          )
          git fetch --no-tags --depth=1 origin "$nd_source_sha"
          git show "$nd_source_sha:packaging/backend-lock.json" > "$RUNNER_TEMP/previous-backend-lock.json"
          git diff --name-only -z "$nd_source_sha" HEAD > "$RUNNER_TEMP/native-source-diff"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def build_coordinates(lock):
              for key in ("version", "published", "application_release"):
                  lock.pop(key, None)
              for arch in lock["architectures"].values():
                  for key in ("url", "sha512", "provenance_url"):
                      arch.pop(key, None)
              return lock
          old = json.loads((Path(os.environ["RUNNER_TEMP"])/"previous-backend-lock.json").read_text())
          current = json.loads(Path("packaging/backend-lock.json").read_text())
          assert build_coordinates(old) == build_coordinates(current), "SDK build coordinates changed"
          paths = (Path(os.environ['RUNNER_TEMP'])/'native-source-diff').read_bytes().split(b'\0')
          # These paths only assemble packages or pin distribution downloads.
          # Compilers, application/test sources and provenance validators remain disallowed.
          allowed = {b'.github/workflows/ci.yml', b'.github/workflows/portable-packages.yml',
                     b'scripts/build-snap', b'scripts/build-flatpak', b'scripts/prepare-native-arch',
                     b'packaging/flatpak/io.github.SigmaCodez.NeutronDrive.json',
                     b'packaging/rpm/neutrondrive.spec', b'packaging/snap/snapcraft.yaml',
                     b'packaging/backend-lock.json', b'packaging/appimage/tools-lock.json',
                     b'packaging/aur/neutrondrive-bin/PKGBUILD',
                     b'packaging/aur/neutrondrive-bin/.SRCINFO'}
          changed = [p.decode() for p in paths if p and p not in allowed and not p.startswith(b'docs/') and not p.endswith(b'.md')]
          assert not changed, 'Native artifact reuse rejects changed application/build/test inputs: '+repr(changed)
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_native_run }}
          name: native-frontend-${{ matrix.architecture }}
          path: build/native-frontend
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_native_run }}
          name: sdk-bridge-${{ matrix.architecture }}
          path: build/backend
      - name: Verify frontend and SDK source provenance again
        env:
          ND_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          def load(name, filename):
              spec = importlib.util.spec_from_file_location(name, Path('packaging')/filename)
              module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
              return module
          architecture = os.environ['ND_ARCHITECTURE']
          load('native_frontend', 'native_frontend.py').verify(Path('build/native-frontend'), architecture)
          load('backend', 'fetch-backend.py').verify_source_build(Path('build/backend/proton-drive'), architecture)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-frontend-${{ matrix.architecture }}
          path: build/native-frontend/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-bridge-${{ matrix.architecture }}
          path: build/backend/proton-drive*
          if-no-files-found: error

  deb:
    needs: [native, verified_native]
    if: always() && (needs.native.result == 'success' || needs.verified_native.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: amd64
            artifact: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            artifact: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      NEUTRONDRIVE_NATIVE_BUILD: ${{ github.workspace }}/build/native-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend-${{ matrix.artifact }}
          path: build/native-frontend
      - uses: actions/download-artifact@v4
        with:
          name: sdk-bridge-${{ matrix.artifact }}
          path: build/backend
      - name: Install package validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate data/io.github.SigmaCodez.NeutronDrive.desktop
      - name: Build and install the native DEB
        run: |
          python3 scripts/build-deb --arch '${{ matrix.architecture }}' --backend build/backend/proton-drive
          dpkg-deb --info dist/*.deb
          sudo apt-get install -y ./dist/*.deb
          # Beta 0.1 resets the public version; epoch 1 must upgrade alpha 0.6.
          nd_installed=$(dpkg-query -W -f='${Version}' neutrondrive)
          dpkg --compare-versions "$nd_installed" gt '0.6.0~alpha15-1'
          python3 desktop/tests/check-staged-runtime.py /usr
          neutrondrive --help
          neutrondrive --diagnose
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.architecture }}
          path: dist/*.deb
          if-no-files-found: error

  ubuntu_2610:
    name: Ubuntu 26.10 DEB (${{ matrix.architecture }})
    needs: deb
    if: always() && needs.deb.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.architecture }}
          path: build/deb
      - name: Install release DEB on Ubuntu 26.10
        run: |
          apt-get update
          apt-get install -y python3 python3-gi gir1.2-gtk-4.0 dbus dbus-x11 xvfb xauth nautilus
          apt-get install -y ./build/deb/*.deb
          test "$(. /etc/os-release; echo "$VERSION_ID")" = 26.10
          test "$(dpkg-query -W -f='${Version}' neutrondrive)" = "$(dpkg-deb -f ./build/deb/*.deb Version)"
          neutrondrive --version
          neutrondrive --diagnose
      - name: Test installed Qt interface and GNOME file-manager integration
        run: |
          python3 desktop/tests/check-staged-runtime.py /usr
          dbus-run-session -- xvfb-run -a env GTK_A11Y=none G_DEBUG=fatal-warnings \
            GIO_USE_VFS=local GIO_USE_VOLUME_MONITOR=unix GSK_RENDERER=cairo \
            python3 file-manager/tests/check-sidebar.py /usr/lib/neutrondrive/bin/libneutrondrive_file_manager.so

  rpm:
    needs: [native, verified_native]
    if: always() && (needs.native.result == 'success' || needs.verified_native.result == 'success')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: fedora
            container: fedora:44
            install: dnf install -y git python3 rpm-build binutils
            install_package: dnf install -y ./dist/*.rpm
          - distribution: opensuse
            container: opensuse/tumbleweed:latest
            install: zypper --non-interactive install git python3 rpm-build binutils
            install_package: zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm ./dist/*.rpm
    container: ${{ matrix.container }}
    env:
      NEUTRONDRIVE_NATIVE_BUILD: ${{ github.workspace }}/build/native-frontend
    steps:
      - name: Install build tools
        run: ${{ matrix.install }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend-x86_64
          path: build/native-frontend
      - uses: actions/download-artifact@v4
        with:
          name: sdk-bridge-x86_64
          path: build/backend
      - name: Build and test the installed native RPM
        run: |
          python3 scripts/build-rpm --backend build/backend/proton-drive
          rpm -qpi dist/*.rpm
          ${{ matrix.install_package }}
          test "$(cat /usr/lib/neutrondrive/package-format)" = "rpm-${{ matrix.distribution }}"
          test "$(rpm -q --queryformat '%{EPOCHNUM}' neutrondrive)" = 1
          python3 desktop/tests/check-staged-runtime.py /usr
          neutrondrive --diagnose
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distribution }}-x86_64
          path: dist/*.rpm
          if-no-files-found: error

  flatpak:
    needs: [native, verified_native]
    if: always() && (needs.native.result == 'success' || needs.verified_native.result == 'success')
    runs-on: ubuntu-24.04
    env:
      NEUTRONDRIVE_NATIVE_BUILD: ${{ github.workspace }}/build/native-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend-x86_64
          path: build/native-frontend
      - uses: actions/download-artifact@v4
        with:
          name: sdk-bridge-x86_64
          path: build/backend
      - name: Install the Flatpak runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50
      - name: Build and test inside the real runtime
        run: python3 scripts/build-flatpak-bundle --backend build/backend/proton-drive --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-x86_64
          path: dist/*.flatpak
          if-no-files-found: error

  snap:
    needs: [native, verified_native]
    if: always() && (needs.native.result == 'success' || needs.verified_native.result == 'success')
    runs-on: ubuntu-24.04
    env:
      NEUTRONDRIVE_NATIVE_BUILD: ${{ github.workspace }}/build/native-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend-x86_64
          path: build/native-frontend
      - uses: actions/download-artifact@v4
        with:
          name: sdk-bridge-x86_64
          path: build/backend
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic
      - name: Prepare verified native frontend and current SDK
        run: python3 scripts/build-snap --backend build/backend/proton-drive --prepare-only build/snap-project
      - name: Build strict snap on the disposable runner
        working-directory: build/snap-project
        run: sudo snapcraft --destructive-mode --build-for=amd64
      - name: Install and test strict Snap on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth openbox wmctrl
          sudo snap install --dangerous ./build/snap-project/*.snap
          # Opening (not merely access/stat) mountinfo must work before sync can
          # validate a folder. Keep this explicit, non-auto-connected permission.
          if snap run --shell neutrondrive -c 'cat /proc/self/mountinfo >/dev/null'; then
            echo 'Unexpected mount-observe access before explicit connection'
            exit 1
          fi
          sudo snap connect neutrondrive:mount-observe
          snap run --shell neutrondrive -c 'cat /proc/self/mountinfo >/dev/null'
          snap run neutrondrive --version
          snap run neutrondrive --diagnose
          # Exercise real job registration, daemon IPC, pause/remove and
          # autostart within confinement, using a deliberately missing SDK.
          snap run --shell neutrondrive -c '
            export SNAP_USER_DATA="$SNAP_USER_DATA/ci-background"
            export XDG_STATE_HOME="$SNAP_USER_DATA/state" XDG_CONFIG_HOME="$SNAP_USER_DATA/config"
            export DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software
            mkdir -p "$SNAP_USER_DATA/local"
            exec "$SNAP/usr/bin/neutrondrive" --check-background "$SNAP/usr/lib/neutrondrive/neutrondrive/locales" "$SNAP_USER_DATA/local"
          '
          # snap run itself needs the real session bus to create its cgroup.
          # Isolate the theme fixture only after entering the strict sandbox
          # and its normal command-chain, without disabling confinement.
          # Window-scoped shortcuts need an active window. Bare Xvfb has no
          # window manager to restore activation after the hide/reopen test.
          # Keep the real X11 backend and every keyboard assertion enabled.
          cat > "$RUNNER_TEMP/neutrondrive-snap-window-test.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail
          openbox --sm-disable > "$RUNNER_TEMP/neutrondrive-snap-wm.log" 2>&1 &
          nd_wm_pid=$!
          trap 'kill "$nd_wm_pid" 2>/dev/null || true' EXIT
          for nd_attempt in {1..50}; do
            if wmctrl -m >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          wmctrl -m
          snap run --shell neutrondrive -c 'export DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent QT_QUICK_BACKEND=software; exec "$SNAP/usr/bin/neutrondrive" --check-window "$SNAP/usr/lib/neutrondrive/neutrondrive/locales"'
          SH
          if ! xvfb-run -a -f "$HOME/.Xauthority" bash "$RUNNER_TEMP/neutrondrive-snap-window-test.sh" \
            > "$RUNNER_TEMP/neutrondrive-snap-window.log" 2>&1; then
            cat "$RUNNER_TEMP/neutrondrive-snap-window.log"
            sudo journalctl --no-pager -n 80 -k
            exit 1
          fi
          cat "$RUNNER_TEMP/neutrondrive-snap-window.log"
          grep -q NATIVE_MAIN_WINDOW_OK "$RUNNER_TEMP/neutrondrive-snap-window.log"
      - uses: actions/upload-artifact@v4
        with:
          name: snap-amd64
          path: build/snap-project/*.snap
          if-no-files-found: error

  portable:
    needs: deb
    if: always() && needs.deb.result == 'success'
    uses: ./.github/workflows/portable-packages.yml
