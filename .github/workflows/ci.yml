name: Tests and Linux packages

on:
  push:
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate platform-independent desktop metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate data/io.github.SigmaCodez.NeutronDrive.desktop
          appstreamcli validate --no-net data/io.github.SigmaCodez.NeutronDrive.metainfo.xml

  native:
    uses: ./.github/workflows/native-build.yml

  deb:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: amd64
            artifact: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            artifact: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      NEUTRONDRIVE_NATIVE_BUILD: ${{ github.workspace }}/build/native-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend-${{ matrix.artifact }}
          path: build/native-frontend
      - uses: actions/download-artifact@v4
        with:
          name: sdk-bridge-${{ matrix.artifact }}
          path: build/backend
      - name: Install package validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate data/io.github.SigmaCodez.NeutronDrive.desktop
      - name: Build and install the native DEB
        run: |
          python3 scripts/build-deb --arch '${{ matrix.architecture }}' --backend build/backend/proton-drive
          dpkg-deb --info dist/*.deb
          sudo apt-get install -y ./dist/*.deb
          python3 desktop/tests/check-staged-runtime.py /usr
          neutrondrive --help
          neutrondrive --diagnose
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.architecture }}
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    needs: native
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: fedora
            container: fedora:44
            install: dnf install -y git python3 rpm-build binutils
            install_package: dnf install -y ./dist/*.rpm
          - distribution: opensuse
            container: opensuse/tumbleweed:latest
            install: zypper --non-interactive install git python3 rpm-build binutils
            install_package: zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm ./dist/*.rpm
    container: ${{ matrix.container }}
    env:
      NEUTRONDRIVE_NATIVE_BUILD: ${{ github.workspace }}/build/native-frontend
    steps:
      - name: Install build tools
        run: ${{ matrix.install }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend-x86_64
          path: build/native-frontend
      - uses: actions/download-artifact@v4
        with:
          name: sdk-bridge-x86_64
          path: build/backend
      - name: Build and test the installed native RPM
        run: |
          python3 scripts/build-rpm --backend build/backend/proton-drive
          rpm -qpi dist/*.rpm
          ${{ matrix.install_package }}
          python3 desktop/tests/check-staged-runtime.py /usr
          neutrondrive --diagnose
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distribution }}-x86_64
          path: dist/*.rpm
          if-no-files-found: error

  flatpak:
    needs: native
    runs-on: ubuntu-24.04
    env:
      NEUTRONDRIVE_NATIVE_BUILD: ${{ github.workspace }}/build/native-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend-x86_64
          path: build/native-frontend
      - uses: actions/download-artifact@v4
        with:
          name: sdk-bridge-x86_64
          path: build/backend
      - name: Install the Flatpak runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50
      - name: Build and test inside the real runtime
        run: python3 scripts/build-flatpak-bundle --backend build/backend/proton-drive --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-x86_64
          path: dist/*.flatpak
          if-no-files-found: error

  snap:
    needs: native
    runs-on: ubuntu-24.04
    env:
      NEUTRONDRIVE_NATIVE_BUILD: ${{ github.workspace }}/build/native-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-frontend-x86_64
          path: build/native-frontend
      - uses: actions/download-artifact@v4
        with:
          name: sdk-bridge-x86_64
          path: build/backend
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic
      - name: Prepare verified native frontend and current SDK
        run: python3 scripts/build-snap --backend build/backend/proton-drive --prepare-only build/snap-project
      - name: Build strict snap on the disposable runner
        working-directory: build/snap-project
        run: sudo snapcraft --destructive-mode --build-for=amd64
      - name: Install and test strict Snap on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          sudo snap install --dangerous ./build/snap-project/*.snap
          snap run neutrondrive --version
          snap run neutrondrive --diagnose
          if ! xvfb-run -a -f "$HOME/.Xauthority" env DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent QT_QUICK_BACKEND=software \
            snap run neutrondrive --check-window /snap/neutrondrive/current/usr/lib/neutrondrive/neutrondrive/locales \
            > "$RUNNER_TEMP/neutrondrive-snap-window.log" 2>&1; then
            cat "$RUNNER_TEMP/neutrondrive-snap-window.log"
            sudo journalctl --no-pager -n 80 -k
            exit 1
          fi
          cat "$RUNNER_TEMP/neutrondrive-snap-window.log"
          grep -q NATIVE_MAIN_WINDOW_OK "$RUNNER_TEMP/neutrondrive-snap-window.log"
      - uses: actions/upload-artifact@v4
        with:
          name: snap-amd64
          path: build/snap-project/*.snap
          if-no-files-found: error

  portable:
    needs: deb
    uses: ./.github/workflows/portable-packages.yml
