name: Native AppImage and Arch packages
on:
  workflow_call:
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: build/deb
      - name: Install the native package and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools desktop-file-utils zsync patchelf libssl3 file
          sudo apt-get install -y ./build/deb/*.deb
      - name: Build from the current verified DEB
        run: |
          nd_deb=(build/deb/*.deb)
          python3 scripts/build-appimage --deb "${nd_deb[0]}" --work-dir "$RUNNER_TEMP/appimage-work"
      - name: Test extracted native startup and stable cached window
        run: |
          mkdir build/appimage-test
          cd build/appimage-test
          ../../dist/NeutronDrive-0.1.0-beta1-x86_64.AppImage --appimage-extract >/dev/null
          export XDG_CACHE_HOME="$RUNNER_TEMP/nd-appimage-cache"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/nd-appimage-config"
          export XDG_STATE_HOME="$RUNNER_TEMP/nd-appimage-state"
          export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent
          squashfs-root/AppRun --help
          squashfs-root/AppRun --diagnose
          nd_catalog=("$XDG_CACHE_HOME"/neutrondrive-appimage/*/usr/lib/neutrondrive/neutrondrive/locales)
          test "${#nd_catalog[@]}" = 1
          squashfs-root/AppRun --check-window "${nd_catalog[0]}"
          python3 ../../desktop/tests/check-staged-runtime.py squashfs-root/usr
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-x86_64
          path: |
            dist/*.AppImage
            dist/APPIMAGE_BUILD_INFO.json
          if-no-files-found: error

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git python namcap dpkg
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: build/deb
      - name: Prepare a local native recipe from the verified DEB
        shell: bash
        run: |
          nd_deb=(build/deb/*.deb)
          python3 scripts/prepare-native-arch --deb "${nd_deb[0]}" --output "$RUNNER_TEMP/arch-native-package"
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          cp -r "$RUNNER_TEMP/arch-native-package" /home/builder/package
          chown -R builder:builder /home/builder/package
      - name: Build and install with makepkg/pacman
        run: |
          su builder -c 'cd /home/builder/package && makepkg --syncdeps --noconfirm && makepkg --printsrcinfo > .SRCINFO'
          # Keep epoch 1 inside .PKGINFO, but remove ':' from the download name:
          # GitHub artifacts reject colons for cross-platform extraction.
          python - <<'PYNAME'
          from pathlib import Path
          import re
          for package in Path('/home/builder/package').glob('*.pkg.tar.zst'):
              name = re.sub(r'^(neutrondrive-bin-)\d+:', r'\1', package.name)
              assert ':' not in name
              if name != package.name:
                  destination = package.with_name(name)
                  assert not destination.exists()
                  package.rename(destination)
          PYNAME
          pacman -U --noconfirm /home/builder/package/*.pkg.tar.zst
          nd_installed=$(pacman -Q neutrondrive-bin | cut -d ' ' -f 2)
          test "$(vercmp "$nd_installed" '0.6.0alpha15-1')" -gt 0
          python3 desktop/tests/check-staged-runtime.py /usr
          neutrondrive --diagnose
          cd /home/builder/package
          namcap PKGBUILD ./*.pkg.tar.zst | tee namcap.log
          if grep -q ' E:' namcap.log; then exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/dist/aur"
          cp PKGBUILD .SRCINFO neutrondrive.deb ./*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/aur/"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          path: dist/aur/*
          include-hidden-files: true
          if-no-files-found: error
