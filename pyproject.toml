[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neutrondrive"
version = "0.6.0a6"
description = "An independent Qt Linux desktop client for Proton Drive"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SigmaCodez"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: File Managers",
]

[project.scripts]
neutrondrive = "neutrondrive.__main__:main"

[project.urls]
Source = "https://github.com/SigmaCodez/NeutronDrive"
Issues = "https://github.com/SigmaCodez/NeutronDrive/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neutrondrive = ["qml/*.qml", "locales/*.json"]
