[package]
name = "neutrondrive-qt"
version = "1.0.9"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
libc = "=0.2.189"
neutrondrive-core = { path = "../core" }
cxx = "=1.0.205"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_full"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[build-dependencies]
cxx-qt-build = "=0.10.0"

[profile.dev]
debug = 0
[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
