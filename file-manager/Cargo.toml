[package]
name = "neutrondrive-file-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
nautilus3 = []

[dependencies]
serde_json = "=1.0.145"
libc = "=0.2.189"
