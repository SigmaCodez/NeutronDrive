name: neutrondrive
base: core24
version: '0.5.0-alpha1'
summary: Independent Linux client for Proton Drive
description: |
  Browse and transfer Proton Drive files with a native Qt interface and the
  bundled SDK-based NeutronDrive event bridge. This is an alpha community project, not
  an official Proton application.

  On-demand FUSE mounts require the native DEB/RPM installation; strict Snap
  confinement does not support this application's unprivileged FUSE helper.
  Browsing, transfers and background folder synchronization work inside Snap.

  A Proton account, browser and desktop Secret Service are required. Before
  sign-in, connect the keyring interface with:
    sudo snap connect neutrondrive:password-manager-service
grade: devel
confinement: strict
license: MIT
website: https://github.com/SigmaCodez/NeutronDrive
source-code: https://github.com/SigmaCodez/NeutronDrive
issues: https://github.com/SigmaCodez/NeutronDrive/issues
icon: data/io.github.SigmaCodez.NeutronDrive.svg

platforms:
  amd64:
  arm64:

slots:
  application-dbus:
    interface: dbus
    bus: session
    name: io.github.SigmaCodez.NeutronDrive
  service-dbus:
    interface: dbus
    bus: session
    name: io.github.SigmaCodez.NeutronDrive.SnapService
  demo-dbus:
    interface: dbus
    bus: session
    name: io.github.SigmaCodez.NeutronDrive.Demo

apps:
  neutrondrive:
    command: usr/bin/neutrondrive
    desktop: usr/share/applications/io.github.SigmaCodez.NeutronDrive.desktop
    extensions: [gnome]
    autostart: io.github.SigmaCodez.NeutronDrive.desktop
    slots: [application-dbus, demo-dbus, service-dbus]
    plugs:
      - home
      - network
      - network-bind
      - password-manager-service
      - removable-media
    environment:
      GTK_USE_PORTAL: '1'
      QT_QPA_PLATFORM: xcb

parts:
  neutrondrive:
    plugin: nil
    source: .
    build-packages: [python3]
    stage-packages: [python3, python3-gi, libsecret-1-0, ca-certificates, libgcc-s1, libatomic1, libopengl0, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-render-util0, libxkbcommon-x11-0, libxcb-randr0, libxcb-sync1, libxcb-xfixes0, libxcb-glx0]
    build-attributes: [no-patchelf]
    override-build: |
      NEUTRONDRIVE_CORE_BUILD="native-core/$CRAFT_ARCH_BUILD_FOR" python3 packaging/stage.py \
        --destdir "$CRAFT_PART_INSTALL" \
        --prefix /usr \
        --arch "$CRAFT_ARCH_BUILD_FOR" \
        --backend "backend/$CRAFT_ARCH_BUILD_FOR/proton-drive" \
        --portal-browser \
        --no-host-services
    # Bun executables have appended application data; never strip the backend.
    override-prime: |
      craftctl default
      python3 "$CRAFT_PROJECT_DIR/packaging/fetch-backend.py" \
        "$CRAFT_PRIME/usr/lib/neutrondrive/bin/proton-drive" \
        --arch "$CRAFT_ARCH_BUILD_FOR"
